name: metabo

services:
  app:
    image: ghcr.io/cgc-umces/metaboscape_app
    ports:
      - "20688:20688" # Change left-hand port if using this for development
    volumes:
      - ${PWD}/R:/home/R
      - ${PWD}/data:/home/data
      - ${PWD}/brand:/home/brand
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped